 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>



<body>

<!-- //============================Customer================================// -->
    <h1 class="headline"><center>Customer Management System</center></h1>
    
    <input  id="txtId" type="text" placeholder="Customer ID">
    <input id="txtName" type="text" placeholder="Customer Name">
    <input id="txtAge" type="text" placeholder="Customer Age">
    <input id="txtAddress" type="text" placeholder="Customer Address">
    <input id="txtSalary" type="text" placeholder="Customer Salary">

    <input type="button" value="Add Customer" onclick="addCustomer()">

    <br>
    <h2>View Customers</h2>

    <table border="1" width ="100%" id="tblCustomers">
        <tr>
            <th>Customer ID</th>
            <th>Customer Name</th>
            <th>Customer Age</th>
            <th>Customer Address</th>
            <th>Customer Salary</th>
        </tr>
    </table>
    <br>
    <br>

    <hr>
    <hr>

    <!-- //=======================Item=========================// -->

    <h1 class="headline"><center>Item Management System</center></h1>

    <input id="itemId" type="text" placeholder="Item ID">
    <input id="itemName" type="text" placeholder="Item Name">
    <input id="itemExp" type="text" placeholder="Item Exp">
    <input id="itemPrice" type="text" placeholder="Item Price">
    <input id="itemNo" type="text" placeholder="Item Contact">

    <input type="button" value="Add Item" onclick="addItem()">

    <br>
    <h2>View Item</h2>

    <table border="1" width="100%" id="tblItem">
        <tr>
            <th>Item ID</th>
            <th>Item Name</th>
            <th>Item EXP</th>
            <th>Item Price</th>
            <th>Item Contact</th>
        </tr>
    </table>

    <script src="app.js"></script>

</body>
</html>
